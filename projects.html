<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - FDO Monitoring</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <i class="fas fa-shield-check"></i>
                <span>FDO Hygiene Monitor</span>
            </div>
            <div class="nav-menu">
                <a href="index.html" class="nav-link">
                    <i class="fas fa-dashboard"></i> Dashboard
                </a>
                <a href="projects.html" class="nav-link active">
                    <i class="fas fa-project-diagram"></i> Projects
                </a>
                <a href="issues.html" class="nav-link">
                    <i class="fas fa-exclamation-triangle"></i> Issues
                </a>
                <div class="notification-bell">
                    <i class="fas fa-bell"></i>
                    <span class="notification-badge" id="notificationCount">0</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-container">
        <!-- Header -->
        <header class="page-header">
            <div class="header-content">
                <h1>Project Management</h1>
                <p class="header-subtitle">Monitor hygiene scores and manage project health</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="refreshData()">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
            </div>
        </header>

        <!-- Project Stats -->
        <div class="stats-grid">
            <div class="stat-card stat-card-info">
                <div class="stat-icon">
                    <i class="fas fa-project-diagram"></i>
                </div>
                <div class="stat-content">
                    <div class="stat-value" id="totalProjects">0</div>
                    <div class="stat-label">Total Projects</div>
                </div>
            </div>

            <div class="stat-card stat-card-success">
                <div class="stat-icon">
                    <i class="fas fa-check-circle"></i>
                </div>
                <div class="stat-content">
                    <div class="stat-value" id="healthyProjects">0</div>
                    <div class="stat-label">Healthy Projects (>80%)</div>
                </div>
            </div>

            <div class="stat-card stat-card-warning">
                <div class="stat-icon">
                    <i class="fas fa-exclamation-triangle"></i>
                </div>
                <div class="stat-content">
                    <div class="stat-value" id="warningProjects">0</div>
                    <div class="stat-label">Needs Attention (60-80%)</div>
                </div>
            </div>

            <div class="stat-card stat-card-critical">
                <div class="stat-icon">
                    <i class="fas fa-times-circle"></i>
                </div>
                <div class="stat-content">
                    <div class="stat-value" id="criticalProjects">0</div>
                    <div class="stat-label">Critical (<60%)</div>
                </div>
            </div>
        </div>

        <!-- Projects Grid -->
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1.5rem;" id="projectsGrid">
            <div class="loading" style="grid-column: 1 / -1;">Loading projects...</div>
        </div>
    </div>

    <!-- Project Details Modal -->
    <div id="projectModal" class="modal">
        <div class="modal-content" style="max-width: 800px;">
            <div class="modal-header">
                <h2>Project Details</h2>
                <button class="modal-close" onclick="closeProjectModal()">&times;</button>
            </div>
            <div class="modal-body" id="projectModalBody">
                <!-- Content populated by JS -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/mock-data.js"></script>
    <script src="js/projects.js"></script>
</body>
</html>
